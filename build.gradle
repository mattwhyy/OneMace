plugins {
    id 'java'
}

group = 'net.mattwhyy'
version = '1.08'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def paperApiVersion = providers.gradleProperty('paperApiVersion').getOrElse('1.21-R0.1-SNAPSHOT')
def mockBukkitArtifact = providers.gradleProperty('mockBukkitArtifact').getOrElse('mockbukkit-v1.21')
def mockBukkitVersion = providers.gradleProperty('mockBukkitVersion').getOrElse('4.116.3')

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")

    testImplementation("io.papermc.paper:paper-api:${paperApiVersion}")
    testImplementation('org.junit.jupiter:junit-jupiter:5.13.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.13.4')
    testImplementation("org.mockbukkit.mockbukkit:${mockBukkitArtifact}:${mockBukkitVersion}")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

test {
    useJUnitPlatform()
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
