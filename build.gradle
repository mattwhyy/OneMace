import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java'
}

group = 'net.mattwhyy'
version = '1.08'

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

def testPaperApiVersion = providers.gradleProperty('testPaperApiVersion').getOrElse('1.21-R0.1-SNAPSHOT')
def mockBukkitDependency = providers.gradleProperty('mockBukkitDependency').getOrElse('com.github.seeseemelk:MockBukkit-v1.21:3.117.0')
def testJvmVersion = providers.gradleProperty('testJvmVersion').map(Integer::parseInt).getOrElse(21)

dependencies {
    compileOnly('io.papermc.paper:paper-api:1.21-R0.1-SNAPSHOT')

    testImplementation("io.papermc.paper:paper-api:${testPaperApiVersion}")
    testImplementation('org.junit.jupiter:junit-jupiter:5.13.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.13.4')
    testRuntimeOnly(mockBukkitDependency)
}

configurations.named('testCompileClasspath') {
    attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, testJvmVersion)
}
configurations.named('testRuntimeClasspath') {
    attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, testJvmVersion)
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
